# Every secret the app reads. Paste this into Streamlit Cloud's Secrets box
# (App settings > Secrets) and fill in the values. Never commit real values;
# a local .streamlit/secrets.toml is git ignored.
#
# Without any secrets the app still starts: Today shows an "isn't set up yet"
# card and the Official report works, because it only reads committed result files.

# Nebius Token Factory (OpenAI compatible). Leave the base URL empty to use
# the default, https://api.tokenfactory.nebius.com/v1/
NEBIUS_API_KEY = ""
NEBIUS_BASE_URL = ""

# Model IDs from scripts/list_models.py. config/active.yaml picks which one
# Today runs (nemotron -> NEMOTRON_MODEL).
NEMOTRON_MODEL = ""
COMPARE_MODEL = ""

# Shared password for Today's Refresh and the Live comparison. Not auth.
# Empty means nothing can be unlocked.
APP_PASSWORD = ""
